[project]
name = "scheduler"
version = "0.1.0"
description = "Dkron Scheduler POC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "ruff",
    "pyright",
    "apscheduler",
    "sqlalchemy",
    "psycopg2-binary",
    "croniter",
    "temporalio"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff.lint]
select = ["I"]

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
norecursedirs = ["postgres-data", "dkron-data"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
