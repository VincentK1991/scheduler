[project]
name = "scheduler"
version = "0.1.0"
description = "Dkron Scheduler POC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "ruff",
    "pyright",
    "apscheduler",
    "sqlalchemy",
    "psycopg2-binary",
    "croniter"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff.lint]
select = ["I"]

[tool.pyright]
typeCheckingMode = "strict"
